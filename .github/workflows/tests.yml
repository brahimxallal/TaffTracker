name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 on 2026-10-19. Bump it deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # With CI=true the firmware host tests (gcc + ASan/UBSan) fail instead of skipping
      # when the toolchain is missing; -rs lists any other skipped tests with reasons.
      - name: Run tests (no perf)
        run: pytest -m "not perf" -rs --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true
